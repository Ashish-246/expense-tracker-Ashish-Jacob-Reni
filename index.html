<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple expense tracker that stores your data in your browser.">
  <meta name="color-scheme" content="dark">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title">Expense Tracker</h1>
    <p class="app-subtitle">Know where your money goes.</p>
  </header>

  <main class="app-main">

    <!-- Summary cards -->
    <section class="summary" aria-labelledby="summary-heading">
      <h2 id="summary-heading" class="visually-hidden">Summary</h2>

      <article class="summary-card summary-card--income">
        <h3 class="summary-card__label">Total income</h3>
        <p class="summary-card__amount" id="total-income">0.00</p>
      </article>

      <article class="summary-card summary-card--expense">
        <h3 class="summary-card__label">Total expenses</h3>
        <p class="summary-card__amount" id="total-expenses">0.00</p>
      </article>

      <article class="summary-card summary-card--balance">
        <h3 class="summary-card__label">Balance</h3>
        <p class="summary-card__amount" id="balance">0.00</p>
      </article>
    </section>

    <!-- Add transaction form -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading" class="card__title">Add transaction</h2>

      <form id="transaction-form" class="transaction-form" novalidate>

        <div class="form-group">
          <label for="transaction-type">Type</label>
          <select id="transaction-type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="transaction-amount">Amount</label>
          <input type="number" id="transaction-amount" name="amount" aria-describedby="amount-error"
                 placeholder="0.00" min="0" step="0.01">
          <small class="error-message" id="amount-error"></small>
        </div>

        <div class="form-group">
          <label for="transaction-category">Category</label>
          <select id="transaction-category" name="category" aria-describedby="category-error">
            <option value="">Select a category</option>
            <option value="salary">Salary</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="housing">Housing</option>
            <option value="entertainment">Entertainment</option>
            <option value="health">Health</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
          <small class="error-message" id="category-error"></small>
        </div>

        <div class="form-group">
          <label for="transaction-date">Date</label>
          <input type="date" id="transaction-date" name="date" aria-describedby="date-error">
          <small class="error-message" id="date-error"></small>
        </div>

        <div class="form-group form-group--wide">
          <label for="transaction-description">Description</label>
          <input type="text" id="transaction-description" name="description" aria-describedby="description-error"
                 placeholder="e.g. Groceries" maxlength="60">
          <small class="error-message" id="description-error"></small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary" id="submit-button">Add transaction</button>
          <button type="button" class="btn btn--secondary" id="cancel-edit-button" hidden>Cancel</button>
        </div>

      </form>
    </section>

    <!-- Transactions: filters and list -->
    <section class="card" aria-labelledby="transactions-heading">
      <h2 id="transactions-heading" class="card__title">Transactions</h2>

      <div class="filters">
        <div class="form-group">
          <label for="filter-type">Show</label>
          <select id="filter-type">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="all">All categories</option>
            <option value="salary">Salary</option>
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="housing">Housing</option>
            <option value="entertainment">Entertainment</option>
            <option value="health">Health</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>
        </div>

        <button type="button" class="btn btn--secondary" id="reset-filters-button">Reset filters</button>
      </div>

      <p class="empty-message" id="empty-message">No transactions yet. Add your first one above.</p>

      <ul class="transaction-list" id="transaction-list"></ul>
    </section>

    <!-- Monthly expense summary -->
    <section class="card" aria-labelledby="monthly-heading">
      <h2 id="monthly-heading" class="card__title">Monthly expense summary</h2>

      <table class="monthly-table">
        <thead>
          <tr>
            <th scope="col">Month</th>
            <th scope="col">Total expenses</th>
          </tr>
        </thead>
        <tbody id="monthly-summary-body"></tbody>
      </table>
    </section>

    <!-- Category-wise expense chart -->
    <section class="card" aria-labelledby="chart-heading">
      <h2 id="chart-heading" class="card__title">Spending by category</h2>

      <div class="category-chart" id="category-chart"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
